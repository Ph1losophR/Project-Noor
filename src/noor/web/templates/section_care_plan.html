{% extends "section_base.html" %}

{% block form %}
<p class="note">{{ withheld }}</p>

<form method="post" action="/visits/{{ visit_id }}/sections/{{ slug }}" data-autosave>
  {% for row in rows %}
  <fieldset class="card">
    <legend class="heading">{{ row.label }}</legend>
    <p class="field">
      <label for="times-{{ row.axis.value }}">Times a week the household measures it</label>
      <input id="times-{{ row.axis.value }}" name="times-{{ row.axis.value }}"
             value="{{ row.times }}" inputmode="numeric" autocomplete="off" dir="ltr">
    </p>
    <p class="field">
      <label for="below-{{ row.axis.value }}">Stop and call below</label>
      <input id="below-{{ row.axis.value }}" name="below-{{ row.axis.value }}"
             value="{{ row.floor }}" inputmode="decimal" autocomplete="off" dir="ltr">
    </p>
    <p class="field">
      <label for="above-{{ row.axis.value }}">Stop and call above</label>
      <input id="above-{{ row.axis.value }}" name="above-{{ row.axis.value }}"
             value="{{ row.ceiling }}" inputmode="decimal" autocomplete="off" dir="ltr">
    </p>
  </fieldset>
  {% endfor %}

  <p class="field">
    <label for="action">What the household does when a stop rule is crossed</label>
    <span class="note">One action, against every stop rule above. A threshold with no
      action against it is prose with a number in it.</span>
    <input id="action" name="action" value="{{ action }}" autocomplete="off" dir="auto">
  </p>

  <p class="actions">
    <button class="button" type="submit">Save and return</button>
  </p>
</form>
{% endblock %}
