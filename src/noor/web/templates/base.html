<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Noor</title>
  <link rel="stylesheet" href="/static/noor.css">
  <link rel="stylesheet" href="/static/print.css" media="print">
</head>
<body>
  <div class="shell">
    <header class="chrome">
      <a class="wordmark" href="/">Noor</a>
      {% block up %}{% endblock %}
      <form class="theme-form" method="post" action="/theme">
        <input type="hidden" name="back" value="{{ back }}">
        <button class="theme" type="submit" aria-label="Switch between light and dark"></button>
      </form>
    </header>
    <main>{% block body %}{% endblock %}</main>
  </div>
</body>
</html>
