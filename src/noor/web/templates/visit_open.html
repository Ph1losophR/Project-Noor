{% extends "visit_base.html" %}
{% block visit %}
<p class="subheading">{{ kind }}</p>
<p class="lede">{{ attendance }}</p>
<div class="subject">
  <h2 class="heading">The record</h2>
  <ul class="tiles">
    {% for section in sections %}
    <li class="tile">
      <p class="subheading">{{ section.name }}</p>
      <p class="{{ section.mark }}">{{ section.word }}</p>
    </li>
    {% endfor %}
  </ul>
</div>
<p class="lede">{{ home_readings }}</p>
<p class="lede">{{ emergencies }}</p>
{% endblock %}
