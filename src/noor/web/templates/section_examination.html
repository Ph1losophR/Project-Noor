{% extends "section_base.html" %}

{% block form %}
<p class="{{ basis_css }}">{{ basis }}</p>

<form method="post" action="/visits/{{ visit_id }}/sections/{{ slug }}" data-autosave>
  {% for row in rows %}
  <p class="field">
    <label for="{{ row.id }}">{{ row.label }}</label>
    <span class="note">{{ row.note }}</span>
    <textarea id="{{ row.id }}" name="{{ row.id }}" rows="2" dir="auto">{{ row.held }}</textarea>
  </p>
  {% endfor %}

  <p class="field">
    <label for="added">Anything else examined</label>
    <span class="note">The Field Team may add elements; it does not decide which are
      required.</span>
    <textarea id="added" name="added" rows="3" dir="auto">{{ added }}</textarea>
  </p>

  <p class="actions">
    <button class="button" type="submit">Save and return</button>
  </p>
</form>
{% endblock %}
