{% extends "section_base.html" %}

{% block form %}
<form method="post" action="/visits/{{ visit_id }}/sections/{{ slug }}" data-autosave>
  <p class="note">What this Visit asks for is composed from the Patient's conditions, not
    chosen here. A box left blank is not a reading.</p>

  {% for field in fields %}
  <p class="field">
    <label for="{{ field.id }}">{{ field.label }} <span class="note">{{ field.unit }}</span></label>
    <input id="{{ field.id }}" name="{{ field.id }}" value="{{ field.held }}"
           inputmode="decimal" autocomplete="off" dir="ltr">
  </p>
  {% endfor %}

  <p class="actions">
    <button class="button" type="submit">Save and return</button>
  </p>
</form>
{% endblock %}
