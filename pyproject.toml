[project]
name = "noor"
version = "0.1.0"
description = "Project Noor — a clinical decision support engine for supervised home visits"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src/noor"]

[tool.coverage.report]
# Empty, not the default ["pragma: no cover"]: a pragma cannot silence the 100%
# branch gate. An unreachable line is a design smell — simplify the code.
exclude_lines = []
